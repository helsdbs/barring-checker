<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check if you should make a barring referral</title>
<style>
:root{--black:#0b0c0c;--white:#fff;--blue:#1d70b8;--dark-blue:#003078;--green:#00703c;--red:#d4351c;--yellow:#ffdd00;--grey1:#505a5f;--grey2:#b1b4b6;--grey3:#f3f2f1}
*{box-sizing:border-box}html{background:#fff}body{margin:0;color:var(--black);font-family:Arial,Helvetica,sans-serif;font-size:19px;line-height:1.5;-webkit-font-smoothing:antialiased}
a,.link-button{color:var(--blue);text-decoration:underline;text-underline-offset:.15em;cursor:pointer}a:hover,.link-button:hover{color:var(--dark-blue);text-decoration-thickness:3px}a:focus,button:focus,input:focus+label,summary:focus{outline:3px solid transparent;background:var(--yellow);color:var(--black);box-shadow:0 -2px var(--yellow),0 4px var(--black);text-decoration:none}
.govuk-header{background:var(--black);color:#fff;border-bottom:10px solid var(--blue)}.width{max-width:960px;margin:0 auto;padding:0 30px}.header-inner{min-height:70px;display:flex;align-items:center;gap:24px}.logo{font-size:30px;font-weight:700;white-space:nowrap}.product{border-left:1px solid #6f777b;padding-left:24px;font-size:22px}.phase{border-bottom:1px solid var(--grey2);padding:10px 0;font-size:16px}.tag{display:inline-block;background:var(--blue);color:#fff;font-weight:700;letter-spacing:1px;padding:2px 8px 1px;margin-right:10px}
main{padding:28px 0 70px;min-height:650px}.back{border:0;background:none;padding:0;margin:0 0 28px;font:inherit;font-size:16px;color:var(--blue);text-decoration:underline;cursor:pointer}.back:before{content:'‹';font-size:22px;margin-right:5px}h1{font-size:42px;line-height:1.08;letter-spacing:-.5px;margin:0 0 24px;max-width:820px}h2{font-size:30px;line-height:1.2;margin:36px 0 16px}p{max-width:760px;margin:0 0 20px}ul{max-width:760px;padding-left:28px;margin-top:0}li{margin-bottom:8px}.hint{color:var(--grey1);max-width:760px}.form-group{max-width:790px;margin:28px 0 32px}.option{position:relative;min-height:42px;margin-bottom:14px}.option input{position:absolute;opacity:0;width:44px;height:44px;margin:0}.option label{display:block;position:relative;padding:7px 10px 7px 54px;cursor:pointer;line-height:1.35}.option label:before{content:'';position:absolute;left:0;top:2px;width:36px;height:36px;border:2px solid var(--black);background:#fff}.radio .option label:before{border-radius:50%}.radio .option input:checked+label:after{content:'';position:absolute;left:10px;top:12px;width:20px;height:20px;border-radius:50%;background:var(--black)}.checkbox .option input:checked+label:after{content:'';position:absolute;left:9px;top:10px;width:18px;height:9px;border:solid var(--black);border-width:0 0 4px 4px;transform:rotate(-45deg)}
.button{border:0;border-radius:0;background:var(--green);color:#fff;font:inherit;font-weight:700;padding:11px 20px 10px;box-shadow:0 2px 0 #002d18;cursor:pointer;margin:4px 0 20px}.button:hover{background:#005a30}.button:active{transform:translateY(2px);box-shadow:none}.button-secondary{background:var(--grey3);color:var(--black);box-shadow:0 2px 0 #929191;margin-left:10px}.button-secondary:hover{background:#dbdad9}.error-summary{display:none;border:5px solid var(--red);padding:18px;max-width:790px;margin-bottom:30px}.error-summary h2{font-size:24px;margin:0 0 8px}.error-summary p,.error-message{color:var(--red);font-weight:700}.has-error{border-left:5px solid var(--red);padding-left:15px}.result-panel{background:var(--blue);color:#fff;text-align:center;padding:34px 25px 30px;margin-bottom:34px}.result-panel h1{max-width:none;margin:5px 0 0}.result-panel.green{background:var(--green)}.result-panel.grey{background:var(--grey1)}.outcome-label{font-weight:700;letter-spacing:1px}.prototype-note{background:#fef7e5;border-left:8px solid var(--yellow);padding:16px 18px;max-width:760px;margin:25px 0}.inset{border-left:10px solid var(--grey2);padding:15px 0 15px 20px;max-width:760px;margin:24px 0}footer{border-top:1px solid var(--grey2);background:var(--grey3);padding:35px 0 50px;color:var(--grey1);font-size:16px}
@media(max-width:700px){body{font-size:17px}.width{padding:0 18px}.header-inner{min-height:58px;gap:12px}.logo{font-size:24px}.product{font-size:17px;padding-left:12px}h1,.result-panel h1{font-size:32px}.button-secondary{display:block;margin-left:0}}
</style>
</head>
<body>
<header class="govuk-header"><div class="width header-inner"><div class="logo">GOV.UK</div><div class="product">Check if you should make a barring referral</div></div></header>
<div class="phase"><div class="width"><strong class="tag">PROTOTYPE</strong>This is a prototype and is not a live DBS service.</div></div>
<main class="width" id="main-content" tabindex="-1"><div id="app"></div></main>
<footer><div class="width">This prototype does not collect or send personal information.</div></footer>
<script>
(()=>{
const answers={};let current='start',history=[];
const o=(value,label,exclusive=false)=>({value,label,exclusive});
const nodes={
start:{type:'question',input:'radio',title:'Do you want to make a referral on behalf of an organisation you work for or belong to?',options:[o('org','Yes'),o('individual',"No, I'm acting as an individual")],next:a=>a==='org'?'org_info':'individual_info'},
individual_info:{type:'question',input:'radio',title:'Tell us if you have any safeguarding information or evidence to send to DBS',body:`<p>To make a barring referral, you need information or evidence that shows the person:</p><ul><li>harmed, or risked harm to a child or vulnerable adult</li><li>may harm, or risks harm to a child or vulnerable adult</li><li>may have received a caution or conviction relevant to barring</li></ul>`,options:[o('yes','Yes'),o('no','No, I do not have any of this information'),o('not_sure','Not sure')],next:a=>a==='yes'?'individual_reported':a==='no'?'O9':'O8'},
individual_reported:{type:'question',input:'radio',title:'Have you reported the concern to another organisation?',hint:"Such as the police, a local authority safeguarding team, LADO, CQC, Ofsted, a professional regulator or the person's employer.",options:[o('yes','Yes'),o('no','No'),o('not_sure','Not sure')],next:a=>a==='yes'?'O4':'O5'},
org_info:{type:'question',input:'radio',title:'Tell us if you have any safeguarding information or evidence to send to DBS',body:`<p>To make a barring referral, you need information or evidence that shows the person:</p><ul><li>harmed, or risked harm to a child or vulnerable adult</li><li>may harm, or risks harm to a child or vulnerable adult</li><li>may have received a caution or conviction relevant to barring</li></ul>`,options:[o('yes','Yes'),o('no','No, I do not have any of this information'),o('not_sure','Not sure')],next:a=>a==='yes'?'org_role':a==='no'?'O9':'O8'},
org_role:{type:'question',input:'radio',title:'Why is your organisation thinking about referring the person for barring?',options:[o('employer','Because we employed them to work for us, or they volunteered for us'),o('supplier','Because we supplied or placed them with another organisation'),o('local_authority','We are a local authority or statutory safeguarding body that investigated a concern against them'),o('regulator','We regulate their work or keep a professional register they belong to'),o('other','We are connected to them in another way'),o('not_sure','Not sure')],next:a=>['employer','supplier'].includes(a)?'workforce':['local_authority','regulator'].includes(a)?'power_work':a==='other'?'O3':'O8'},
power_work:{type:'question',input:'radio',title:'Has the person ever worked with children or vulnerable adults, or might they in the future?',options:[o('yes','Yes'),o('no','No'),o('not_sure','Not sure')],next:a=>a==='yes'?'power_barring':a==='no'?'O3':'O7'},
power_barring:{type:'question',input:'radio',title:'Do you think DBS may need to consider whether the person should be added to the barred list?',options:[o('yes','Yes'),o('no','No'),o('not_sure','Not sure')],next:a=>a==='yes'?'O2':a==='no'?'O3':'O8'},
workforce:{type:'question',input:'checkbox',title:'Does your safeguarding information involve work the person did with children or vulnerable adults?',hint:'Select all that apply:',options:[o('children','Work with children'),o('adults','Work with vulnerable adults'),o('neither','No, it does not involve work they did with children or vulnerable adults',true),o('not_sure','Not sure',true)],next:a=>a.includes('neither')?'O3':a.includes('not_sure')?'O7':a.includes('children')?'child_special':'adult_activities'},
child_special:{type:'question',input:'checkbox',title:'Did the person carry out any of this work with children?',hint:'Select all that apply:',options:[o('healthcare','They provided healthcare'),o('personal_care','They provided personal care'),o('foster','They were registered, or applying to register, as a foster carer or private foster carer'),o('childcare','They were registered, or applying to register, as a childminder or childcare provider'),o('none','None of these',true),o('not_sure','Not sure',true)],next:a=>any(a,['healthcare','personal_care','foster','childcare'])?'action_taken':'child_direct'},
child_direct:{type:'question',input:'checkbox',title:'Did the person carry out any of this work with children?',hint:'Select all that apply:',options:[o('teach','Taught, trained or instructed children'),o('care','Cared for or supervised children'),o('guidance','Gave children advice or guidance about education or wellbeing'),o('none','None of these',true),o('not_sure','Not sure',true)],next:a=>any(a,['teach','care','guidance'])?'child_frequency':'child_online'},
child_frequency:{type:'question',input:'checkbox',title:'How often did the person carry out this work?',hint:'Select all that apply:',options:[o('more3','On more than 3 days in any 30-day period'),o('overnight','At least once overnight between 2am and 6am, with an opportunity for face-to-face contact with a child'),o('none','None of these',true),o('not_sure','Not sure',true)],next:a=>any(a,['more3','overnight'])?'child_employment':'child_online'},
child_employment:{type:'question',input:'radio',title:'Did the work only involve helping 16- or 17-year olds gain paid or unpaid employment?',hint:'For example, giving 16- or 17-year olds induction training when starting work or supervising them at work.',options:[o('yes','Yes, the person only carried out this type of work'),o('no','No'),o('not_sure','Not sure')],next:a=>a==='no'?'action_taken':'child_online'},
child_online:{type:'question',input:'radio',title:'Did the person moderate a web service mainly used by children on more than 3 days in a 30-day period?',options:[o('yes','Yes'),o('no','No'),o('not_sure','Not sure')],next:a=>a==='yes'?'action_taken':'child_driving'},
child_driving:{type:'question',input:'radio',title:'Did the person drive children as part of an organised service on more than 3 days in a 30-day period?',options:[o('yes','Yes'),o('no','No'),o('not_sure','Not sure')],next:a=>a==='yes'?'action_taken':'child_establishment'},
child_establishment:{type:'question',input:'radio',title:"Did the person work in a school, nursery, children's home or another establishment mainly for children?",options:[o('yes','Yes'),o('no','No'),o('not_sure','Not sure')],next:a=>a==='yes'?'child_establishment_details':'child_management'},
child_establishment_details:{type:'question',input:'radio',title:"Tell us if all of these statements apply to the person's work in the children's establishment",body:`<p>The person:</p><ul><li>worked there on more than 3 days in a 30-day period, or once overnight between 2am and 6am with an opportunity for face-to-face contact with a child</li><li>had an opportunity to have contact with children because of their role</li><li>worked there for the purpose of the establishment</li><li>was doing more than temporary or occasional work</li></ul><p><strong>Do all of these statements apply?</strong></p>`,options:[o('yes','Yes'),o('no','No'),o('not_sure','Not sure')],next:a=>a==='yes'?'action_taken':'child_management'},
child_management:{type:'question',input:'radio',title:'Did the person manage or supervise any workers or volunteers on a day-to-day basis?',options:[o('yes','Yes'),o('no','No'),o('not_sure','Not sure')],next:a=>a==='yes'?'child_managed_activities':finishChildNoManagement(a)},
child_managed_activities:{type:'question',input:'checkbox',title:'Did anyone they managed or supervised carry out this type of work with children?',body:`<p>The person I want to refer managed or supervised on a day-to-day basis:</p>`,options:[o('special','Someone who provided healthcare or personal care, or was registered as a foster carer, childminder or childcare provider'),o('direct','Someone who taught, trained, instructed or gave guidance to children on more than 3 days in a 30-day period or, or at least once overnight between 2am and 6am with an opportunity for face-to-face contact with a child'),o('care','Someone who cared for or supervised children on more than 3 days in a 30-day period or, or at least once overnight between 2am and 6am with an opportunity for face-to-face contact with a child'),o('online',"Someone who moderated a children's online service on more than 3 days in a 30-day period"),o('driving','Someone who drove children as part of an organised service on more than 3 days in a 30-day period'),o('none','None of these',true),o('not_sure','Not sure',true)],next:a=>any(a,['special','direct','care','online','driving'])?'action_taken':'child_managed_establishment'},
child_managed_establishment:{type:'question',input:'radio',title:"Did the person manage or supervise someone who worked in a school, nursery, children's home or another establishment mainly for children?",options:[o('yes','Yes'),o('no','No'),o('not_sure','Not sure')],next:a=>a==='yes'?'child_managed_establishment_details':finishChildrenAssessment(a)},
child_managed_establishment_details:{type:'question',input:'radio',title:'Tell us if all of these statements apply',body:`<p>The person I want to refer managed or supervised someone who worked in a children's establishment:</p><ul><li>on more than 3 days in a 30-day period, or once overnight between 2am and 6am with an opportunity for face-to-face contact with a child</li><li>who had an opportunity to have contact with children because of their role</li><li>who worked there for the purpose of the establishment</li><li>who was doing more than temporary or occasional work</li></ul><p><strong>Do all of these statements apply?</strong></p>`,options:[o('yes','Yes'),o('no','No'),o('not_sure','Not sure')],next:a=>a==='yes'?'action_taken':finishChildrenAssessment(a)},
adult_activities:{type:'question',input:'checkbox',title:'Did the person carry out any of this work with vulnerable adults?',hint:'Select all that apply:',body:`<p>The person I want to refer:</p>`,options:[o('healthcare','Provided healthcare as a regulated health professional'),o('healthcare_supervised','Provided healthcare under the direction or supervision of a regulated healthcare professional'),o('personal_care','Provided personal care, including prompting, supervision, training, instruction, advice or guidance about personal care'),o('money','Helped with cash, bills or shopping because the adult could not do it themselves'),o('affairs',"Had a formal responsibility for managing the adult's affairs for example they had powers of attorney, or were appointed to receive benefit payments on behalf of the adult"),o('transport','Transported an adult to, from or between healthcare, personal care or social care services because the adult could not do it themselves. This does not include someone acting only as a licensed taxi driver or private-hire driver.'),o('social_work','Provided social work as a social care worker to an adult who was a client or potential client'),o('management','Regularly managed or supervised someone day-to-day who carried out any of these activities'),o('none','None of these',true),o('not_sure','Not sure',true)],next:a=>any(a,['healthcare','healthcare_supervised','personal_care','money','affairs','transport','social_work','management'])?'action_taken':a.includes('not_sure')?'O7':'O3'},
action_taken:{type:'question',input:'radio',title:'What action did the organisation take in relation to the safeguarding concern?',options:[o('stopped','We stopped them from doing the work, either by dismissing them or by moving them to non-regulated activity'),o('left','They resigned, retired or otherwise left before we made a final decision'),o('paused','We temporarily paused or suspended their work'),o('returned','We allowed them to return to the work after we had made enquiries'),o('no_decision','We have not made a decision yet'),o('not_sure','Not sure')],next:a=>a==='stopped'?'stop_reason':a==='left'?'would_have_done':['paused','returned','no_decision'].includes(a)?'remaining_concern':'O8'},
stop_reason:{type:'question',input:'radio',title:'Why was the person stopped from doing the work?',options:[o('safeguarding','Because of the safeguarding concern'),o('several','For several reasons, including the safeguarding concern'),o('other','For another reason'),o('not_sure','Not sure')],next:a=>['safeguarding','several'].includes(a)?'O1':a==='other'?'O3':'O8'},
would_have_done:{type:'question',input:'radio',title:'What would the organisation have done if the person had not left?',options:[o('stopped','We would have stopped them from doing the work because of the safeguarding concern, either by dismissing them or by moving them to non-regulated activities'),o('continue','We would have allowed them to continue with the work'),o('no_decision','We had not reached a decision'),o('paused','We would have temporarily paused or suspended their work'),o('not_sure','Not sure')],next:a=>a==='stopped'?'O1':a==='no_decision'?'info_gathered':a==='not_sure'?'O8':'O3'},
remaining_concern:{type:'question',input:'radio',title:'Does your organisation believe there is still a safeguarding concern DBS should consider?',options:[o('yes','Yes'),o('no','No'),o('not_sure','Not sure')],next:a=>a==='yes'?'info_gathered':a==='no'?'O9':'O8'},
info_gathered:{type:'question',input:'checkbox',title:'What information has your organisation gathered about the safeguarding concern?',hint:'Select all that apply:',options:[o('enquiries','We have made reasonable enquiries and can explain what we think happened'),o('credible','We have some credible safeguarding information but cannot reasonably obtain more'),o('advised','The police or a safeguarding professional advised us to make the referral'),o('other_investigation','We have some information, but another organisation is still investigating'),o('report','We have completed an investigation and report'),o('disciplinary','We have carried out disciplinary proceedings'),o('conviction','We have information that the person received a caution or a conviction that may be relevant to barring'),o('none','None of these',true),o('not_sure','Not sure',true)],next:a=>any(a,['enquiries','credible','advised','other_investigation','report','disciplinary','conviction'])?'O3':a.includes('none')?'O6':'O8'},
O1:outcome('OUTCOME 1','Your organisation must make a barring referral',`<p>Based on your answers, your organisation appears to have a legal duty to make a barring referral.</p><p><a href="#">Get your information ready.</a></p>`,'Start a barring referral','green'),
O2:outcome('OUTCOME 2','Your organisation has the power to make a barring referral',`<p>Based on your answers, your organisation is acting in a statutory safeguarding, regulatory or registration role and DBS may need to consider if the person should be barred.</p><p><a href="#">Get your information ready.</a></p>`,'Start a barring referral','green'),
O3:outcome('OUTCOME 3','Your organisation can make a barring referral',`<p>Based on your answers, the checker has not established that your organisation has a legal duty or statutory power to refer.</p><p><a href="#">Get your information ready.</a></p>`,'Start a barring referral','green'),
O4:outcome('OUTCOME 4','You can make a barring referral',`<p>Based on your answers, you do not have a legal duty to refer, but you can make a barring referral and send DBS the safeguarding information you have.</p><p><a href="#">Get your information ready.</a></p>`,'Start a barring referral','green'),
O5:outcome('OUTCOME 5','Report the concern to an organisation that can investigate',`<p>Report the concern to the police, children's or adult social services, the person's employer or volunteer manager or another appropriate safeguarding organisation.</p><p>You can still send safeguarding information you have to DBS by making a referral, but DBS cannot carry out investigations into safeguarding concerns.</p>`,'Start a barring referral',''),
O6:outcome('OUTCOME 6','Make reasonable enquiries before deciding whether to make a referral',`<p>Your organisation has an allegation but has not gathered enough information to decide whether the referral conditions are met.</p><p>You do not need a specialist investigation team if you do not have one. Record the concern, preserve relevant information, take any immediate safeguarding action and make reasonable enquiries.</p>`,'Start a barring referral',''),
O7:outcome('OUTCOME 7',"Get advice about the person's work before deciding whether to make a referral",`<p>The checker cannot determine whether the person's work was regulated activity from your answers. This means it cannot safely determine if you have a duty to refer.</p><p>Find out more about the person's work, then return to the checker.</p><p>You can still make a barring referral if you have safeguarding information now that DBS should consider.</p>`,'Start a barring referral',''),
O8:outcome('OUTCOME 8','Get advice before deciding whether to make a referral',`<p>The checker cannot determine if you have a duty to make a referral. This is because important facts are uncertain.</p><p>Find out more about the case or contact DBS for help. Do not delay safeguarding action while getting advice.</p><p>You can still make a barring referral if you have safeguarding information now that DBS should consider.</p>`,'Start a barring referral',''),
O9:outcome('OUTCOME 9','A barring referral does not appear to be needed',`<p>Based on your answers, the checker has not identified safeguarding information indicating harm, a risk of harm, future risk of harm or a potentially relevant caution or conviction.</p><p>Any other safeguarding, employment, disciplinary or reporting responsibilities should be followed.</p>`,'Exit checker','grey')
};
function outcome(label,title,body,action,panel=''){return{type:'outcome',label,title,body,action,panel}}
function any(arr,cands){return Array.isArray(arr)&&cands.some(x=>arr.includes(x))}
function workforces(){return answers.workforce||[]}
function finishChildNoManagement(a){if(workforces().includes('adults'))return'adult_activities';return a==='not_sure'?'O7':'O3'}
function finishChildrenAssessment(a){if(a==='yes')return'action_taken';if(workforces().includes('adults'))return'adult_activities';return a==='not_sure'?'O7':'O3'}
function render(){const app=document.getElementById('app'),n=nodes[current];document.title=n.title+' - GOV.UK';const back=history.length?'<button class="back" id="back" type="button">Back</button>':'';if(n.type==='outcome'){app.innerHTML=back+`<div class="result-panel ${n.panel}"><div class="outcome-label">${n.label}</div><h1>${n.title}</h1></div>${n.body}<button class="button" id="primary" type="button">${n.action}</button><button class="button button-secondary" id="restart" type="button">Start again</button>`;bindBack();document.getElementById('restart').onclick=restart;document.getElementById('primary').onclick=e=>{e.preventDefault(); if(current==='O9')restart(); else alert('Prototype link');};focus();return}
const saved=answers[current];const inputs=n.options.map((x,i)=>{const id=current+'-'+i,checked=Array.isArray(saved)?saved.includes(x.value):saved===x.value;return`<div class="option"><input type="${n.input==='checkbox'?'checkbox':'radio'}" name="answer" id="${id}" value="${x.value}" data-exclusive="${x.exclusive?'true':'false'}" ${checked?'checked':''}><label for="${id}">${x.label}</label></div>`}).join('');app.innerHTML=back+`<div class="error-summary" id="summary" tabindex="-1"><h2>There is a problem</h2><p id="summaryText"></p></div><h1>${n.title}</h1>${n.body||''}${n.hint?`<p class="hint">${n.hint}</p>`:''}<form id="form" novalidate><div class="form-group ${n.input==='checkbox'?'checkbox':'radio'}" id="group"><p class="error-message" id="inline" hidden></p>${inputs}</div><button class="button" type="submit">Continue</button></form>`;bindBack();bindExclusive();document.getElementById('form').onsubmit=submit;focus()}
function submit(e){e.preventDefault();const n=nodes[current];let v=n.input==='checkbox'?[...document.querySelectorAll('input[name=answer]:checked')].map(x=>x.value):document.querySelector('input[name=answer]:checked')?.value;if(!v||(Array.isArray(v)&&!v.length))return error(n.input==='checkbox'?'Select at least one answer':'Select an answer');if(Array.isArray(v)){const ex=n.options.find(x=>x.exclusive&&v.includes(x.value));if(ex&&v.length>1)return error(`“${ex.label}” cannot be selected with another answer`)}answers[current]=v;history.push(current);current=typeof n.next==='function'?n.next(v):n.next;render()}
function error(msg){const s=document.getElementById('summary'),g=document.getElementById('group'),i=document.getElementById('inline');s.style.display='block';document.getElementById('summaryText').textContent=msg;g.classList.add('has-error');i.hidden=false;i.textContent='Error: '+msg;s.focus()}
function bindExclusive(){const boxes=[...document.querySelectorAll('input[type=checkbox]')];boxes.forEach(b=>b.onchange=()=>{if(!b.checked)return;if(b.dataset.exclusive==='true')boxes.filter(x=>x!==b).forEach(x=>x.checked=false);else boxes.filter(x=>x.dataset.exclusive==='true').forEach(x=>x.checked=false)})}
function bindBack(){const b=document.getElementById('back');if(b)b.onclick=()=>{current=history.pop();render()}}
function restart(){Object.keys(answers).forEach(k=>delete answers[k]);history=[];current='start';render()}
function focus(){document.getElementById('main-content').focus();window.scrollTo(0,0)}
render();
})();
</script>
</body></html>
